<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>元宝派 · 话题生成 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    color: #1D1D1F; overflow: hidden;
    letter-spacing: 0;
  }
  /* === Apple 风画布：暖灰渐变 + 极弱光晕（参考 apple.com / iOS 设置）=== */
  body {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255, 200, 220, 0.18), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(180, 200, 255, 0.16), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 245, 230, 0.12), transparent 60%),
      linear-gradient(180deg, #EDEAE5 0%, #E5E2DD 100%);
    background-attachment: fixed;
  }

  /* ===== Stripe 紫主题（去 Claude 化）=====
     主色:     #635BFF (Stripe purple)
     强调金:   #FFB800 (丰富 marker，紫金高级搭配)
     辅紫:     #8B85FF (浅紫 - hover/KPI 数字)
     深紫:     #4F46E5 (按钮 hover / 强 accent)
     衍生青:   #06B6D4 (避免衍生和主色撞紫)
     共创红:   #F43F5E
     事件蓝:   #2196F3
     议题绿:   #10B981
     底:       #FAFBFC / #F1F3F7 / #FFFFFF
     文字:     #1A1F2C / #5A6378 / #8B94A8
  */

  /* 顶部栏：毛玻璃 */
  .topbar {
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    position: relative; z-index: 10;
  }
  .topbar .brand { font-size: 15px; font-weight: 600; color: #0F172A; letter-spacing: -0.015em; }
  .topbar .brand .sub { color: #94A3B8; font-weight: 400; margin-left: 8px; font-size: 12.5px; }
  .topbar .kpis { display: flex; gap: 8px; }
  .kpi {
    background: rgba(255, 255, 255, 0.6);
    padding: 7px 13px; border-radius: 9px;
    font-size: 11.5px; color: #475569;
    border: 1px solid rgba(15, 23, 42, 0.06);
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  }
  .kpi b { color: #635BFF; font-size: 14px; margin-right: 4px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi.kpi-skip {
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(15, 23, 42, 0.05);
    color: #64748B;
  }
  .kpi.kpi-skip b { color: #64748B; }
  .topbar .controls { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: linear-gradient(135deg, #635BFF, #7C5CFF); color: #fff; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 12.5px;
    font-weight: 600;
    box-shadow:
      0 1px 2px rgba(99, 91, 255, 0.25),
      0 4px 12px rgba(99, 91, 255, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.005em;
  }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.7);
    color: #0F172A;
    border: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    backdrop-filter: blur(8px);
  }
  .btn:hover { transform: translateY(-1px); box-shadow:
    0 2px 6px rgba(99, 91, 255, 0.32),
    0 8px 20px rgba(99, 91, 255, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.2); }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.95); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06); }
  select {
    background: rgba(255, 255, 255, 0.7); color: #0F172A;
    border: 1px solid rgba(15, 23, 42, 0.08);
    padding: 7px 12px; border-radius: 8px; font-size: 12.5px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.15s;
  }
  select:hover { background: rgba(255, 255, 255, 0.95); border-color: rgba(15, 23, 42, 0.12); }

  /* 速度控制 */
  .speed-ctrl {
    display: inline-flex; align-items: center; gap: 2px;
    background: rgba(15, 23, 42, 0.04);
    padding: 3px;
    border-radius: 8px;
    border: 1px solid rgba(15, 23, 42, 0.04);
  }
  .speed-btn {
    background: transparent; color: #64748B; border: none;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
    font-size: 11.5px; font-weight: 600; font-family: "JetBrains Mono", "SF Mono", monospace;
    transition: all 0.15s;
  }
  .speed-btn:hover { background: rgba(255, 255, 255, 0.7); color: #0F172A; }
  .speed-btn.active {
    background: #FFFFFF; color: #635BFF;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 0 0 0.5px rgba(15, 23, 42, 0.04);
  }

  /* 主体三栏：白卡浮在浅蓝灰底上 */
  .layout {
    display: flex;
    height: calc(100% - 64px - 52px);
    padding: 16px;
    gap: 16px;
  }
  .chat-panel {
    flex: 1.3;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    display: flex; flex-direction: column;
    border: 0.5px solid rgba(0, 0, 0, 0.06);
    border-radius: 18px;
    box-shadow:
      0 0.5px 1px rgba(0, 0, 0, 0.04),
      0 12px 32px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }
  .chat-header {
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-title { font-size: 13.5px; color: #0F172A; font-weight: 600; letter-spacing: -0.01em; }
  .chat-title .meta { color: #94A3B8; font-size: 12px; margin-left: 8px; font-weight: 400; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.12); border-radius: 3px; }
  .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.2); }

  /* 日期分隔已隐藏 */
  .day-divider { display: none; }

  .silence {
    text-align: center; margin: 14px 0; padding: 10px;
    background: #F1F3F7; border: 1px dashed #B5BBC9;
    border-radius: 8px; color: #5A6378; font-size: 12px; font-weight: 500;
  }

  /* 消息气泡（Figma 高保真风格） */
  .msg {
    display: flex; gap: 12px; margin-bottom: 16px;
    animation: fadeInUp 0.35s ease-out;
    align-items: flex-start;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* 头像：圆形真图 + 极柔阴影 */
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    overflow: hidden;
    background: #F5F5F7;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.06),
      0 0 0 0.5px rgba(0, 0, 0, 0.04);
    user-select: none;
  }
  .avatar img {
    width: 100%; height: 100%; display: block;
    object-fit: cover;
  }
  .msg-body { flex: 1; min-width: 0; }
  .msg-meta {
    font-size: 12px; color: #8B94A8; margin-bottom: 5px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .msg-meta .name {
    color: #1A1F2C; font-weight: 600; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .msg-meta .time { color: #8B94A8; font-size: 11px; font-weight: 400; }
  /* 气泡：iMessage 风格——暖白 + 极弱描边 */
  .bubble {
    display: inline-block; max-width: 85%;
    background: #F5F5F7;
    padding: 9px 13px;
    border-radius: 4px 16px 16px 16px;
    color: #1D1D1F;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    border: 0.5px solid rgba(0, 0, 0, 0.04);
    box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.04);
  }
  .msg.highlight .bubble {
    background: linear-gradient(135deg, #FFF8E7, #FFEFC4);
    border-color: rgba(255, 184, 0, 0.18);
  }
  /* 机器人/元宝消息：紫调差异色 */
  .msg.bot .bubble {
    background: linear-gradient(135deg, #F4F2FF, #EFEAFF);
    border: 0.5px solid rgba(99, 91, 255, 0.12);
    color: #3C3858;
    font-size: 13.5px;
    white-space: pre-line;
    max-width: 90%;
  }

  /* 触发点（新建：Stripe 紫） */
  .trigger-marker {
    margin: 18px 0; padding: 13px 16px;
    background: linear-gradient(90deg, #EEEDFF, #F8F7FF);
    border-left: 4px solid #635BFF; border-radius: 8px;
    color: #4338CA; font-size: 12px;
    animation: pulseGlow 1.2s ease-out;
    box-shadow: 0 2px 8px rgba(99, 91, 255, 0.08);
  }
  .trigger-marker .title { font-weight: 700; color: #635BFF; margin-bottom: 4px; font-size: 13px; letter-spacing: -0.01em; }
  @keyframes pulseGlow {
    0% { background: linear-gradient(90deg, #C7C2FF, #DCD9FF); }
    100% { background: linear-gradient(90deg, #EEEDFF, #F8F7FF); }
  }

  /* 丰富：金色（紫金搭配） */
  .enrich-marker {
    margin: 14px 0; padding: 11px 14px;
    background: linear-gradient(90deg, #FFF7E0, #FFFCF0);
    border-left: 4px solid #FFB800;
    border-radius: 8px; color: #8C6000; font-size: 12px;
    box-shadow: 0 2px 6px rgba(255, 184, 0, 0.06);
  }
  .enrich-marker .title { font-weight: 700; color: #B28800; margin-bottom: 3px; font-size: 13px; letter-spacing: -0.01em; }
  /* 衍生：青色（避免和主色撞紫） */
  .derive-marker {
    margin: 14px 0; padding: 11px 14px;
    background: linear-gradient(90deg, #E0F7FA, #F0FCFD);
    border-left: 4px solid #06B6D4;
    border-radius: 8px; color: #0E7490; font-size: 12px;
    box-shadow: 0 2px 6px rgba(6, 182, 212, 0.06);
  }
  .derive-marker .title { font-weight: 700; color: #06B6D4; margin-bottom: 3px; font-size: 13px; letter-spacing: -0.01em; }

  /* 放弃/留池：中性灰（agent 克制信号） */
  .skip-marker {
    margin: 14px 0; padding: 11px 14px;
    background: linear-gradient(90deg, #F1F3F7, #FAFBFC);
    border-left: 4px solid #8B94A8;
    border-radius: 8px; color: #5A6378; font-size: 12px;
    box-shadow: 0 2px 6px rgba(139, 148, 168, 0.06);
  }
  .skip-marker .title { font-weight: 700; color: #5A6378; margin-bottom: 3px; font-size: 13px; letter-spacing: -0.01em; }
  .skip-marker .skip-reason {
    margin-top: 6px; padding: 6px 10px;
    background: rgba(139, 148, 168, 0.08); border-radius: 4px;
    font-size: 11px; color: #6B7280; font-style: italic;
  }

  /* 右侧话题栏 */
  .topic-panel {
    flex: 1;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    display: flex; flex-direction: column;
    border: 0.5px solid rgba(0, 0, 0, 0.06);
    border-radius: 18px;
    box-shadow:
      0 0.5px 1px rgba(0, 0, 0, 0.04),
      0 12px 32px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }
  .topic-header {
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    font-size: 13.5px; color: #0F172A; font-weight: 600; letter-spacing: -0.01em;
  }
  .topic-list { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .topic-list::-webkit-scrollbar { width: 6px; }
  .topic-list::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.12); border-radius: 3px; }
  .topic-list::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.2); }

  .empty-hint {
    color: #94A3B8; font-size: 12px; text-align: center; padding: 40px 16px;
    font-style: italic;
  }

  /* 首屏引导卡 */
  .intro-card {
    margin: 30px auto; max-width: 540px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: saturate(180%) blur(20px);
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 12px 32px rgba(15, 23, 42, 0.08);
    border: 1px solid rgba(15, 23, 42, 0.06);
  }
  .intro-title {
    font-size: 17px; font-weight: 700; color: #0F172A;
    letter-spacing: -0.02em; margin-bottom: 14px;
  }
  .intro-body p { font-size: 13.5px; line-height: 1.75; color: #475569; margin: 8px 0; }
  .intro-body b { color: #0F172A; font-weight: 600; }
  .intro-body .intro-tip { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(15, 23, 42, 0.06); color: #635BFF; font-weight: 500; }
  .hint-pill {
    display: inline-block; padding: 2px 9px; border-radius: 10px;
    font-size: 11.5px; font-weight: 600; margin-right: 4px;
    letter-spacing: 0.2px;
  }
  .hint-pill.hint-new { background: #EEEDFF; color: #4338CA; }
  .hint-pill.hint-enrich { background: #FFF7E0; color: #92400E; }
  .hint-pill.hint-derive { background: #E0F7FA; color: #0E7490; }
  .hint-pill.hint-skip { background: #F1F3F7; color: #5A6378; }

  .topic-card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid rgba(15, 23, 42, 0.06);
    animation: flyIn 0.5s ease-out;
    position: relative;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 4px 12px rgba(15, 23, 42, 0.04);
    transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .topic-card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 12px 28px rgba(15, 23, 42, 0.10);
    border-color: rgba(99, 91, 255, 0.2);
  }
  @keyframes flyIn {
    from { opacity: 0; transform: translateX(20px) scale(0.95); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .topic-card .type-badge {
    display: inline-flex; align-items: center;
    background: #635BFF; color: #fff;
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
    margin-bottom: 10px; font-weight: 600; letter-spacing: 0.3px;
    line-height: 1.4;
  }
  /* 五类话题：用饱和但和谐的彩色（主色紫为指南，其他保留差异） */
  .topic-card.type-指南 .type-badge { background: #635BFF; }
  .topic-card.type-体验 .type-badge { background: #06B6D4; }
  .topic-card.type-事件 .type-badge { background: #2196F3; }
  .topic-card.type-共创 .type-badge { background: #F43F5E; }
  .topic-card.type-议题 .type-badge { background: #10B981; }

  .topic-card .title { font-size: 14.5px; font-weight: 700; color: #1A1F2C; margin-bottom: 6px; line-height: 1.5; letter-spacing: -0.01em; }
  .topic-card .summary { font-size: 13px; color: #1A1F2C; line-height: 1.72; }
  .topic-card .meta {
    font-size: 11px; color: #8B94A8; margin-top: 12px;
    padding-top: 10px; border-top: 1px dashed #E5E8EE;
    display: flex; justify-content: space-between;
  }
  .topic-card .reason-tag {
    display: inline-block; background: #EEEDFF;
    color: #4338CA; font-size: 11px; padding: 3px 9px; border-radius: 10px;
    margin-top: 10px; font-weight: 500;
  }
  .topic-card.enriched { box-shadow: 0 0 0 2px #FFB800, 0 4px 12px rgba(255, 184, 0, 0.18); }
  .topic-card.is-history .type-badge { margin-bottom: 0; }
  .topic-card.is-history { background: linear-gradient(135deg, #FAFBFC, #F5F4FF); border: 1px solid #D7D4FF; }
  .history-badge {
    display: inline-flex; align-items: center;
    background: #EEEDFF; color: #4338CA;
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
    font-weight: 600; letter-spacing: 0.3px;
    line-height: 1.4;
  }
  .topic-card .enrich-note {
    background: #FFF7E0; border-left: 3px solid #FFB800;
    padding: 7px 10px; margin-top: 10px; font-size: 11px; color: #8C6000;
    border-radius: 4px; font-weight: 500;
  }

  /* 底部时间轴 */
  .timeline {
    height: 52px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    display: flex; align-items: center; padding: 0 24px; gap: 12px;
  }
  .timeline .progress-wrap {
    flex: 1; height: 4px; background: rgba(15, 23, 42, 0.06); border-radius: 2px; position: relative;
    cursor: pointer;
  }
  .timeline .progress-fill {
    height: 100%; background: linear-gradient(90deg, #635BFF, #8B85FF);
    border-radius: 2px; width: 0%; transition: width 0.2s;
  }
  .timeline .marker-dot {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 10px; height: 10px; border-radius: 50%;
    background: #635BFF; border: 2px solid #FFFFFF;
    box-shadow: 0 0 0 0.5px rgba(99, 91, 255, 0.6), 0 2px 4px rgba(99, 91, 255, 0.25);
  }
  .timeline .marker-dot.enrich { background: #F59E0B; box-shadow: 0 0 0 0.5px rgba(245, 158, 11, 0.6), 0 2px 4px rgba(245, 158, 11, 0.25); }
  .timeline .marker-dot.derive { background: #06B6D4; box-shadow: 0 0 0 0.5px rgba(6, 182, 212, 0.6), 0 2px 4px rgba(6, 182, 212, 0.25); }
  .timeline .marker-dot.skip { background: #94A3B8; box-shadow: 0 0 0 0.5px rgba(148, 163, 184, 0.6), 0 2px 4px rgba(148, 163, 184, 0.25); }
  .timeline .time-display { color: #475569; font-size: 11.5px; font-family: "JetBrains Mono", "SF Mono", monospace; font-weight: 500; letter-spacing: -0.01em; }

  .legend { display: flex; gap: 14px; font-size: 11px; color: #475569; font-weight: 500; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legend .dot.trigger { background: #635BFF; }
  .legend .dot.enrich { background: #FFB800; }
  .legend .dot.derive { background: #06B6D4; }
  .legend .dot.skip { background: #8B94A8; }

  /* ===================== 移动端适配 ===================== */
  @media (max-width: 820px) {
    html, body { overflow: auto; }
    .topbar {
      height: auto; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
    }
    .topbar .brand { font-size: 15px; width: 100%; }
    .topbar .brand .sub { display: none; }
    .topbar .kpis { width: 100%; order: 3; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .kpi { padding: 5px 10px; font-size: 11px; flex-shrink: 0; }
    .kpi b { font-size: 14px; }
    .topbar .controls { flex-wrap: wrap; gap: 6px; width: 100%; }
    .controls select { flex: 1 1 100%; }
    .btn { padding: 8px 14px; font-size: 12px; }
    .speed-ctrl { flex-shrink: 0; }

    .layout { flex-direction: column; height: auto; min-height: calc(100vh - 200px); }
    .chat-panel { flex: 1 1 auto; min-height: 60vh; border-right: none; border-bottom: 1px solid #E5E8EE; }
    .topic-panel { flex: 1 1 auto; min-height: 40vh; }

    .chat-scroll { padding: 14px 14px; }
    .bubble { max-width: 88%; font-size: 14px; padding: 9px 13px; }
    .msg.bot .bubble { max-width: 92%; font-size: 12.5px; }
    .avatar { width: 32px; height: 32px; }
    .avatar .ava-emoji { font-size: 14px; }
    .avatar .ava-text { font-size: 12px; }

    .trigger-marker, .enrich-marker, .derive-marker, .skip-marker {
      margin: 12px 0; padding: 10px 12px; font-size: 11.5px;
    }
    .trigger-marker .title, .enrich-marker .title, .derive-marker .title, .skip-marker .title { font-size: 12.5px; }

    .topic-card { padding: 13px; }
    .topic-card .title { font-size: 13.5px; }

<script>
// ========== 动态加载 case 索引 + 选中 case 数据 ==========
// 所有数据都在 data/ 目录下，换真数据只需替换 JSON 文件

const chatScroll = document.getElementById('chat-scroll');
const topicList = document.getElementById('topic-list');
const topicCount = document.getElementById('topic-count');
const progressFill = document.getElementById('progress-fill');
const progressText = document.getElementById('progress-text');
const progressWrap = document.getElementById('progress-wrap');
const currentTime = document.getElementById('current-time');
const groupName = document.getElementById('group-name');
const groupMeta = document.getElementById('group-meta');
const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');
const caseSelector = document.getElementById('case-selector');

const kpiMsg = document.getElementById('kpi-msg');
const kpiNew = document.getElementById('kpi-new');
const kpiEnrich = document.getElementById('kpi-enrich');
const kpiDerive = document.getElementById('kpi-derive');
const kpiSkip = document.getElementById('kpi-skip');

let currentCase = null;   // 当前 case 的完整数据对象
let caseIndex = null;     // data/index.json 内容
let cursor = 0;
let playing = false;
let timer = null;
let counters = { msg: 0, new: 0, enrich: 0, derive: 0, skip: 0 };
let playbackSpeed = 2;    // 默认 2x

function updateKPI() {
  kpiMsg.textContent = counters.msg;
  kpiNew.textContent = counters.new;
  kpiEnrich.textContent = counters.enrich;
  kpiDerive.textContent = counters.derive;
  if (kpiSkip) kpiSkip.textContent = counters.skip;
}

async function loadCaseIndex() {
  try {
    const r = await fetch('data/index.json');
    caseIndex = await r.json();
    caseSelector.innerHTML = '';
    // 按 group 字段（动作类型）分组渲染 optgroup
    const groupOrder = ['新建', '丰富', '衍生', '反例'];
    const groupEmoji = { '新建': '✨', '丰富': '🔄', '衍生': '🌱', '反例': '⏸' };
    const grouped = {};
    caseIndex.cases.forEach(c => {
      const g = c.group || '其他';
      (grouped[g] = grouped[g] || []).push(c);
    });
    groupOrder.forEach(g => {
      if (!grouped[g]) return;
      const og = document.createElement('optgroup');
      og.label = `${groupEmoji[g] || ''} ${g}（${grouped[g].length}）`;
      grouped[g].forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.label;
        if (c.status !== 'ready') opt.disabled = true;
        og.appendChild(opt);
      });
      caseSelector.appendChild(og);
    });
    // 默认选第一个 ready 的
    const firstReady = caseIndex.cases.find(c => c.status === 'ready');
    if (firstReady) {
      caseSelector.value = firstReady.id;
      await loadCase(firstReady.id);
    }
  } catch (e) {
    caseSelector.innerHTML = '<option>加载失败，请用本地服务器打开</option>';
    console.error('加载 data/index.json 失败：', e);
    alert('请用本地服务器打开此页面，不能直接双击 file:// 打开\n推荐：在 demo_mock 目录运行 python3 -m http.server 8000');
  }
}

async function loadCase(caseId) {
  const meta = caseIndex.cases.find(c => c.id === caseId);
  if (!meta) return;
  const r = await fetch(meta.file);
  currentCase = await r.json();
  // 更新顶部群名
  groupName.textContent = currentCase.group?.name || currentCase.title || caseId;
  // 动态计算 meta：避免 JSON 里的硬编码跟实际消息数不一致
  const events = currentCase.events || [];
  const msgs = events.filter(e => e.t === 'msg');
  const senderSet = new Set(msgs.map(m => m.sender));
  const times = msgs.map(m => m.time).filter(Boolean);
  let durationLabel = '';
  if (times.length >= 2) {
    // 时间格式可能是 "10:30" 或 "昨 22:30"，简单计算第一条和最后一条
    durationLabel = ` · ${times[0]} - ${times[times.length-1]}`;
  }
  groupMeta.textContent = `${senderSet.size} 位成员 · ${msgs.length} 条消息${durationLabel}`;
  reset();
  renderTimelineDots();
}

// 扫描所有 enrich/derive 事件用到的 topicId
// 如果它没有对应的 'new' 事件创造，就当作"已存在的历史话题"——从 case 自带 prerenderTopics 或内置 history fallback 渲染一张卡
function prerenderHistoryTopics() {
  if (!currentCase) return;
  const newIds = new Set();
  const refIds = new Set();
  currentCase.events.forEach(ev => {
    if (ev.t !== 'trigger') return;
    if (ev.mode === 'new' || ev.mode === 'derive') newIds.add(String(ev.topicId));
    if (ev.mode === 'enrich' || ev.mode === 'derive') {
      if (ev.targetTopicId != null) refIds.add(String(ev.targetTopicId));
      // 兼容老 mock 数据：enrich 的 topicId 直接指向已有话题
      if (ev.mode === 'enrich' && ev.topicId != null) refIds.add(String(ev.topicId));
    }
  });
  // 缺失的 = 被引用但没被新建的
  const missing = [...refIds].filter(id => !newIds.has(id));
  if (missing.length === 0) return;

  // 清空 empty-hint
  if (topicList.querySelector('.empty-hint')) topicList.innerHTML = '';

  // 从 case 自带 prerenderTopics 或默认 history 拿数据
  const history = currentCase.prerenderTopics || DEFAULT_HISTORY;
  missing.forEach(id => {
    const hist = history[id] || history[`T_HIS_${String(id).padStart(3, '0')}`] || DEFAULT_HISTORY[id];
    const t = hist || {
      typeLabel: '已沉淀',
      type: '指南',
      title: `历史话题 #${id}`,
      summary: '（已沉淀历史话题占位）',
      reason: '上下文匹配',
      members: '——',
      range: '——'
    };
    const card = document.createElement('div');
    card.className = `topic-card type-${t.type || '指南'} is-history`;
    card.id = `topic-${id}`;
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <span class="type-badge">${escapeHTML(t.typeLabel || '实用指南型')}</span>
        <span class="history-badge">📚 派内已沉淀</span>
      </div>
      <div class="title">${escapeHTML(t.title)}</div>
      <div class="summary">${escapeHTML(t.summary)}</div>
      ${t.reason ? `<div class="reason-tag">进入理由：${escapeHTML(t.reason)}</div>` : ''}
      <div class="meta">
        <span>${escapeHTML(t.members || '——')}</span>
        <span>${escapeHTML(t.range || '——')}</span>
      </div>
    `;
    topicList.appendChild(card);
  });
  topicCount.textContent = `${topicList.querySelectorAll('.topic-card').length} 条`;
}

// 默认 history 兜底数据（基于 history_candidates.json 压缩版）
const DEFAULT_HISTORY = {
  "1": {
    typeLabel: "实用指南型",
    type: "指南",
    title: "只玩 FIFA 和蜘蛛侠的人，PS5 和 Switch 2 怎么选？",
    summary: "群里围绕'只玩 FIFA 和蜘蛛侠的玩家该买哪台主机'展开讨论。多数发言认为 PS5 更匹配这类玩家偏好；Switch 2 优势在便携、独占和合家欢。后续讨论延伸到 PS5 数字版/光驱版的取舍，重点在二手盘和长期使用。",
    reason: "想参考",
    members: "5 位成员",
    range: "2026-05-05"
  },
  "2": {
    typeLabel: "真实体验型",
    type: "体验",
    title: "腾讯会议 AI 纪要实测：能替代速记，决策会议还得人肉复核",
    summary: "群成员分享一周内用腾讯会议 AI 纪要开 5 场会的真实体验。踩坑：发言人识别合并、黑话识别成同音字、纪要偏流水账。惊喜：会后 10 秒出纪要、自动识别 action item。最终共识：一般业务会议可用，决策会议人肉复核。",
    reason: "想参考",
    members: "6 位成员",
    range: "2026-05-07"
  }
};

function render(ev) {
  if (ev.t === 'day') {
    const d = document.createElement('div');
    d.className = 'day-divider';
    d.innerHTML = `<span>📅 ${ev.label}</span>`;
    chatScroll.appendChild(d);
    currentTime.textContent = ev.label;
  } else if (ev.t === 'msg') {
    const m = currentCase.members[ev.sender] || { color: '#999', emoji: '?' };
    const isBot = ev.sender === '元宝' || ev.sender === '元宝助手' || m.emoji === '🤖';
    // 头像：bot 用元宝专属图，真人用 dicebear avataaars（同 sender 永远同头像）
    const avaImg = avatarUrl(ev.sender, isBot);
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isBot ? ' bot' : '');
    wrap.innerHTML = `
      <div class="avatar"><img src="${avaImg}" alt="" loading="lazy" /></div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="name">${escapeHTML(ev.sender)}</span>
          <span class="time">${escapeHTML(ev.time)}</span>
        </div>
        <div class="bubble">${escapeHTML(ev.text)}</div>
      </div>
    `;
    chatScroll.appendChild(wrap);
    counters.msg++;
    updateKPI();
  } else if (ev.t === 'silence') {
    // 文案健化：原始数据里可能是"自然停顿 · 811 分钟无新消息"这种噪声
    // 跨日/跨小时的长停顿完全隐藏；短停顿用人味文案替代
    const minMatch = /(\d+)\s*分钟/.exec(ev.text || '');
    const mins = minMatch ? parseInt(minMatch[1]) : 0;
    if (mins > 60) {
      // 跨小时级别直接跳过，不渲染
      chatScroll.scrollTop = chatScroll.scrollHeight;
      updateProgress();
      return;
    }
    const d = document.createElement('div');
    d.className = 'silence';
    d.textContent = mins > 0 ? `💤 群里安静了 ${mins} 分钟` : ev.text;
    chatScroll.appendChild(d);
  } else if (ev.t === 'trigger') {
    renderTrigger(ev);
  }
  chatScroll.scrollTop = chatScroll.scrollHeight;
  updateProgress();
}

// 把单色 hex 转成 135° 双色渐变（自动加亮 + 加暗）
function avatarGradient(hex) {
  const c = hex.replace('#', '');
  if (c.length !== 6) return `linear-gradient(135deg, ${hex}, ${hex})`;
  const r = parseInt(c.slice(0, 2), 16);
  const g = parseInt(c.slice(2, 4), 16);
  const b = parseInt(c.slice(4, 6), 16);
  const lighter = `rgb(${Math.min(255, r + 38)}, ${Math.min(255, g + 38)}, ${Math.min(255, b + 38)})`;
  const darker = `rgb(${Math.max(0, r - 24)}, ${Math.max(0, g - 24)}, ${Math.max(0, b - 24)})`;
  return `linear-gradient(135deg, ${lighter}, ${darker})`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// === 头像 URL：用 dicebear v9 personas 风格生成扁平人像，sender 名做 seed 永远一致 ===
// bot 单独用 bottts 风格区分。dicebear 是 CDN，免登录、零依赖。
function avatarUrl(sender, isBot) {
  const seed = encodeURIComponent(sender || 'guest');
  if (isBot) {
    // 元宝 bot: 专用机器人头像，配色统一紫金
    return `https://api.dicebear.com/9.x/bottts-neutral/svg?seed=${seed}&backgroundColor=635BFF,8B85FF&backgroundType=gradientLinear&radius=50`;
  }
  // 真人：personas 风格，柔和暖色背景
  const bgColors = ['fde68a', 'fed7aa', 'fecaca', 'd9f99d', 'bae6fd', 'ddd6fe', 'fbcfe8', 'fef3c7'];
  // 简单 hash 选背景色，保证同 sender 同色
  let h = 0;
  for (let i = 0; i < sender.length; i++) h = (h * 31 + sender.charCodeAt(i)) >>> 0;
  const bg = bgColors[h % bgColors.length];
  return `https://api.dicebear.com/9.x/personas/svg?seed=${seed}&backgroundColor=${bg}&radius=50`;
}

function renderTrigger(ev) {
  const marker = document.createElement('div');
  marker.className = ev.mode === 'enrich' ? 'enrich-marker' :
                     ev.mode === 'derive' ? 'derive-marker' :
                     ev.mode === 'skip' ? 'skip-marker' : 'trigger-marker';
  const modeLabel = ev.mode === 'enrich' ? '🔄 话题被丰富' :
                    ev.mode === 'derive' ? '🌱 衍生新话题' :
                    ev.mode === 'skip' ? '⏸ 判定 = 放弃沉淀' : '✨ 触发话题生成';
  const fakeTag = ev.fake_note ? `<div style="font-size:10px;color:#b8a3ff;margin-bottom:4px;font-style:italic;">${escapeHTML(ev.fake_note)}</div>` : '';
  const skipReason = ev.mode === 'skip' && ev.skipReason
    ? `<div class="skip-reason">理由：${escapeHTML(ev.skipReason)}</div>` : '';
  marker.innerHTML = `
    ${fakeTag}
    <div class="title">${modeLabel}</div>
    <div>${(ev.stages || []).map(s => `<div style="margin-top:3px;">&nbsp;&nbsp;${escapeHTML(s)}</div>`).join('')}</div>
    ${skipReason}
  `;
  chatScroll.appendChild(marker);

  if (ev.mode === 'new' || ev.mode === 'derive') {
    if (topicList.querySelector('.empty-hint')) topicList.innerHTML = '';
    const t = ev.topic;
    const card = document.createElement('div');
    card.className = `topic-card type-${t.type}`;
    card.id = `topic-${ev.topicId}`;
    card.innerHTML = `
      <span class="type-badge">${escapeHTML(t.typeLabel)}</span>
      ${t.parentHint ? `<div style="font-size:10px;color:#b39ddb;margin-bottom:6px;">🌱 ${escapeHTML(t.parentHint)}</div>` : ''}
      <div class="title">${escapeHTML(t.title)}</div>
      <div class="summary">${escapeHTML(t.summary)}</div>
      <div class="reason-tag">进入理由：${escapeHTML(t.reason)}</div>
      <div class="meta">
        <span>${escapeHTML(t.members)}</span>
        <span>${escapeHTML(t.range)}</span>
      </div>
    `;
    topicList.appendChild(card);
    topicCount.textContent = `${topicList.querySelectorAll('.topic-card').length} 条`;
    if (ev.mode === 'new') counters.new++;
    if (ev.mode === 'derive') counters.derive++;
  } else if (ev.mode === 'enrich') {
    // 兼容两种字段：targetTopicId（新规范）和 topicId（老 mock 数据）
    const targetId = ev.targetTopicId != null ? ev.targetTopicId : ev.topicId;
    const card = document.getElementById(`topic-${targetId}`);
    if (card) {
      card.classList.add('enriched');
      // 滚动到被丰富的卡片
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      const note = document.createElement('div');
      note.className = 'enrich-note';
      note.textContent = ev.enrichNote || '话题被丰富';
      card.appendChild(note);
    } else {
      console.warn(`[enrich] 找不到目标话题 topic-${targetId}，请检查 case JSON 的 topicId / targetTopicId 字段`);
    }
    counters.enrich++;
  } else if (ev.mode === 'skip') {
    counters.skip++;
  }
  updateKPI();
}

function updateProgress() {
  if (!currentCase) { progressFill.style.width = '0%'; progressText.textContent = '0 / 0 条'; return; }
  // 用「消息条数」口径，跟左上 KPI 保持一致
  const totalMsgs = currentCase.events.filter(e => e.t === 'msg').length;
  const playedMsgs = counters.msg;
  // 进度条用「事件级别」算百分比（让 trigger 也推进进度，体感更顺）
  const totalEvents = currentCase.events.length;
  const pct = totalEvents > 0 ? Math.round((cursor / totalEvents) * 100) : 0;
  progressFill.style.width = pct + '%';
  progressText.textContent = `${playedMsgs} / ${totalMsgs} 条`;
}

function step() {
  if (!currentCase) return;
  if (cursor >= currentCase.events.length) {
    playing = false;
    btnPlay.textContent = '✓ 播放完成';
    clearTimeout(timer);
    return;
  }
  const ev = currentCase.events[cursor];
  cursor++;
  render(ev);

  let delay = 600;
  if (ev.t === 'silence') delay = 900;
  else if (ev.t === 'trigger') delay = 1800;
  else if (ev.t === 'day') delay = 700;

  // 应用速度倍率
  delay = Math.round(delay / playbackSpeed);

  clearTimeout(timer);
  timer = setTimeout(step, delay);
}

function play() {
  if (!currentCase) { alert('请先选择 case'); return; }
  if (playing) {
    clearTimeout(timer);
    playing = false;
    btnPlay.textContent = '▶ 继续';
    return;
  }
  playing = true;
  btnPlay.textContent = '⏸ 暂停';
  step();
}

function reset() {
  clearTimeout(timer);
  playing = false;
  cursor = 0;
  counters = { msg: 0, new: 0, enrich: 0, derive: 0, skip: 0 };
  chatScroll.innerHTML = '';
  topicList.innerHTML = '<div class="empty-hint">点击「开始播放」<br>AI 会从群聊中自动沉淀话题…</div>';
  topicCount.textContent = '0 条';
  btnPlay.textContent = '▶ 开始播放';
  updateKPI();
  updateProgress();
  currentTime.textContent = '—';
  // reset 之后重新预渲染 history 占位卡
  prerenderHistoryTopics();
}

function renderTimelineDots() {
  progressWrap.querySelectorAll('.marker-dot').forEach(d => d.remove());
  if (!currentCase) return;
  const total = currentCase.events.length;
  currentCase.events.forEach((ev, i) => {
    if (ev.t === 'trigger') {
      const dot = document.createElement('div');
      dot.className = 'marker-dot ' + (ev.mode === 'enrich' ? 'enrich' : ev.mode === 'derive' ? 'derive' : ev.mode === 'skip' ? 'skip' : '');
      dot.style.left = ((i / total) * 100) + '%';
      progressWrap.appendChild(dot);
    }
  });
}

btnPlay.addEventListener('click', play);
btnReset.addEventListener('click', reset);
caseSelector.addEventListener('change', e => {
  if (e.target.value) loadCase(e.target.value);
});

// 速度切换
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    playbackSpeed = parseFloat(btn.dataset.speed);
  });
});

// 启动
loadCaseIndex();

// === drawer: 状态 ===
let wasPlayingBeforeDrawer = false;
const drawer = document.getElementById('drawer');
const drawerMask = document.getElementById('drawerMask');
const drawerBody = document.getElementById('drawerBody');
const drawerClose = document.getElementById('drawerClose');

// === drawer: 反推命中消息 ===
function computeHitMsgs(topicId) {
  if (!currentCase) return { hitMsgs: [], topic: null, isHistory: false };
  const events = currentCase.events;
  const idx = events.findIndex(ev =>
    ev.t === 'trigger' &&
    (ev.mode === 'new' || ev.mode === 'derive') &&
    String(ev.topicId) === String(topicId)
  );
  if (idx < 0) {
    // history placeholder
    const histTopic = (currentCase.prerenderTopics && currentCase.prerenderTopics[topicId])
      || (typeof DEFAULT_HISTORY !== 'undefined' && DEFAULT_HISTORY[topicId])
      || null;
    return { hitMsgs: [], topic: histTopic, isHistory: true };
  }
  const triggerEv = events[idx];
  const msgs = [];
  for (let i = idx - 1; i >= 0; i--) {
    const e = events[i];
    if (e.t === 'trigger' && (e.mode === 'new' || e.mode === 'derive')) break;
    if (e.t === 'msg') msgs.unshift(e);
  }
  return { hitMsgs: msgs, topic: triggerEv.topic, isHistory: false };
}

// === drawer: 打开 ===
function openDrawer(topicId) {
  const { hitMsgs, topic, isHistory } = computeHitMsgs(topicId);
  if (!topic) return; // 找不到任何信息就放弃

  // 暂停播放
  if (playing) {
    wasPlayingBeforeDrawer = true;
    clearTimeout(timer);
    playing = false;
    btnPlay.textContent = '▶ 继续';
  } else {
    wasPlayingBeforeDrawer = false;
  }

  // 参与人（去重保持顺序）
  const senders = isHistory
    ? []
    : [...new Set(hitMsgs.map(m => m.sender))];

  const memberHTML = senders.map(s => {
    const m = (currentCase.members && currentCase.members[s]) || {};
    const isBot = s === '元宝' || s === '元宝助手' || m.emoji === '🤖';
    const safe = escapeHTML(s);
    return `<div class="drawer-member" title="${safe}">
      <div class="drawer-avatar"><img src="${avatarUrl(s, isBot)}" alt="" /></div>
      <span class="drawer-mname">${safe}</span>
    </div>`;
  }).join('');

  const msgHTML = isHistory
    ? `<div class="drawer-empty">这是派内已沉淀的历史话题，本场未触发原始消息</div>`
    : hitMsgs.length === 0
      ? `<div class="drawer-empty">暂无命中消息</div>`
      : hitMsgs.map(m => `<div class="drawer-msg">
          <div class="m-head"><span class="m-sender">${escapeHTML(m.sender)}</span><span class="m-time">${escapeHTML(m.time)}</span></div>
          <div class="m-text">${escapeHTML(m.text)}</div>
        </div>`).join('');

  drawerBody.innerHTML = `
    <div class="drawer-section">
      ${topic.typeLabel ? `<span class="type-badge" style="display:inline-flex;align-items:center;background:#635BFF;color:#fff;font-size:11px;padding:3px 10px;border-radius:12px;margin-bottom:10px;font-weight:600;letter-spacing:0.3px;line-height:1.4;">${escapeHTML(topic.typeLabel)}</span>` : ''}
      <div class="d-title">${escapeHTML(topic.title || '')}</div>
      <div class="d-summary">${escapeHTML(topic.summary || '')}</div>
      ${topic.reason ? `<div style="margin-top:10px;"><span class="d-reason">进入理由：${escapeHTML(topic.reason)}</span></div>` : ''}
    </div>
    ${senders.length ? `<div class="drawer-section">
      <div class="section-title">参与人 · ${senders.length}</div>
      <div class="drawer-members">${memberHTML}</div>
    </div>` : ''}
    <div class="drawer-section">
      <div class="section-title">${isHistory ? '历史背景' : `命中消息 · ${hitMsgs.length}`}</div>
      ${msgHTML}
    </div>
  `;

  drawer.classList.add('open');
  drawerMask.classList.add('open');
}

// === drawer: 关闭 ===
function closeDrawer() {
  drawer.classList.remove('open');
  drawerMask.classList.remove('open');
  if (wasPlayingBeforeDrawer) {
    wasPlayingBeforeDrawer = false;
    play(); // play() 已内置 toggle，从暂停态切回播放继续 step
  }
}

// === drawer: 事件绑定 ===
topicList.addEventListener('click', (e) => {
  const card = e.target.closest('.topic-card');
  if (!card) return;
  const tid = card.id.replace(/^topic-/, '');
  if (!tid) return;
  openDrawer(tid);
});
drawerMask.addEventListener('click', closeDrawer);
drawerClose.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
});
</script>
</body>
</html>
